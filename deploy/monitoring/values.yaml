# kube-prometheus-stack Helm values for the local kind cluster.
# Chart: prometheus-community/kube-prometheus-stack 92.3.0
# Trimmed to fit a laptop: no Alertmanager, no node-exporter, no control-plane scraping.

alertmanager:
  enabled: false
nodeExporter:
  enabled: false

# Control-plane components are not reachable on kind: their targets would stay down.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    # Pick up every ServiceMonitor/PodMonitor in the cluster, not only the ones
    # labelled for this Helm release: each service ships its own ServiceMonitor.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  # Admin credentials come from a Secret created outside Git (see docs).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      # Load every ConfigMap labelled grafana_dashboard=1 as a dashboard
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
