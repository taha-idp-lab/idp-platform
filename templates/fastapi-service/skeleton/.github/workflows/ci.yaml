# CI pipeline shared by every service generated from the FastAPI template.
# lint + tests -> build image -> Trivy scan -> push to GHCR (main branch only)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

  build:
    name: Build, scan & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.IMAGE }}

  deploy-dev:
    name: Deploy to dev (GitOps)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deployment at a time per service; never cancel a deployment in progress
    concurrency:
      group: deploy-dev-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Short-lived token from the dedicated "gitops bot" GitHub App,
      # scoped to the idp-gitops repository only (contents: write)
      - name: Get GitOps bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: idp-gitops
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/idp-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Update image tag in idp-gitops
        working-directory: gitops
        env:
          SERVICE: ${{ github.event.repository.name }}
          TAG: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          FILE="apps/${SERVICE}/values-dev.yaml"
          if [ ! -f "$FILE" ]; then
            echo "::notice::${FILE} not found: the deployment PR has not been merged yet. Skipping."
            exit 0
          fi
          yq -i '.image.tag = strenv(TAG) | .image.tag style="double" | .image.pullPolicy = "IfNotPresent"' "$FILE"
          if git diff --quiet; then
            echo "Already deployed: ${TAG}"
            exit 0
          fi
          git config user.name "idp-gitops-bot"
          git config user.email "idp-gitops-bot@users.noreply.github.com"
          git commit -am "deploy(${SERVICE}): dev -> ${TAG::7}" -m "Source: ${SOURCE_URL}"
          # Other services may push at the same time: rebase and retry
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt ${attempt}), rebasing..."
            git pull --rebase
          done
          echo "::error::Could not push to idp-gitops"
          exit 1
