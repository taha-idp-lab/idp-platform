apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: taha-idp-lab/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: ${{ values.name }}
    argocd/app-name: ${{ values.name }}-dev
  links:
    - url: http://localhost:3001/d/fastapi-services?var-service=${{ values.name }}
      title: Grafana dashboard
      icon: dashboard
  tags:
    - python
    - fastapi
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-demo
