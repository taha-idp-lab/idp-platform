# Default values for the service. Environment-specific overrides live in the
# idp-gitops repository (apps/<service>/values-<env>.yaml).

replicaCount: 1

image:
  repository: ghcr.io/taha-idp-lab/${{ values.name }}
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: ${{ values.name }}.dev.local

# Prometheus scraping of GET /metrics (requires the Prometheus Operator in the cluster)
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
