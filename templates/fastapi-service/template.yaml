apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-service
  title: FastAPI Service
  description: Python microservice (FastAPI) with CI, Trivy scan, Helm chart, GitOps deployment and docs
  tags:
    - python
    - fastapi
    - recommended
spec:
  owner: group:platform-team
  type: service

  # ---------- 1. The form ----------
  parameters:
    - title: Service information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase letters, digits and dashes (e.g. orders-api). Also used as the repository name.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One sentence explaining what the service does
          maxLength: 120
        owner:
          title: Owner team
          type: string
          description: Team responsible for this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

  # ---------- 2. The steps ----------
  steps:
    - id: fetch
      name: Generate code from skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        # GitHub Actions and Helm use {{ }} too: copy those files as-is.
        copyWithoutTemplating:
          - .github/workflows/*
          - chart/templates/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: fetch-gitops
      name: Generate GitOps configuration
      action: fetch:template
      input:
        url: ./gitops-skeleton
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        sourcePath: ./service
        repoUrl: github.com?owner=taha-idp-lab&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false
        # The owner team gets write access (required for CODEOWNERS to be valid)
        collaborators:
          - team: ${{ parameters.owner }}
            access: push

    # GitHub needs a moment before the new repo's files are readable via the API
    # (eventual consistency). Without this, catalog:register fails intermittently with a 400.
    - id: wait
      name: Wait for GitHub to index the repository
      action: debug:wait
      input:
        seconds: 5

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # Declares the service in the GitOps repo. Merging the PR deploys it (ArgoCD ApplicationSet).
    - id: gitops-pr
      name: Open deployment PR in idp-gitops
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=taha-idp-lab&repo=idp-gitops
        branchName: add-${{ parameters.name }}
        title: 'feat: deploy ${{ parameters.name }} to dev'
        description: |
          Generated by Backstage (FastAPI Service template).
          Merging this PR deploys **${{ parameters.name }}** to the dev environment through ArgoCD.
        sourcePath: ./gitops
        targetPath: apps/${{ parameters.name }}
        teamReviewers:
          - platform-team

  # ---------- 3. What the user sees at the end ----------
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Deployment PR (idp-gitops)
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
