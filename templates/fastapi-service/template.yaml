apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-service
  title: FastAPI Service
  description: Python microservice (FastAPI) with tests, Dockerfile and catalog registration
  tags:
    - python
    - fastapi
    - recommended
spec:
  owner: group:platform-team
  type: service

  # ---------- 1. The form ----------
  parameters:
    - title: Service information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase letters, digits and dashes (e.g. orders-api). Also used as the repository name.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 40
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One sentence explaining what the service does
          maxLength: 120
        owner:
          title: Owner team
          type: string
          description: Team responsible for this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

  # ---------- 2. The steps ----------
  steps:
    - id: fetch
      name: Generate code from skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=taha-idp-lab&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ---------- 3. What the user sees at the end ----------
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
